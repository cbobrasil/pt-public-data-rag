[project]
name = "pt-public-data-rag"
version = "0.1.0"
description = "Production-style RAG pipeline over Portuguese public data on Databricks"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "fastembed>=0.9.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
